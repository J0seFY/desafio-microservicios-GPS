services:
  db:
    container_name: estudiante-db
    image: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: estudiante_db
    
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
  estudiante-services:
    container_name: estudiante-services
    build:
      context: ./estudiante-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - db

  evaluacion-services:
    container_name: evaluacion-services
    build:
      context: ./evaluacion-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      - db
volumes:
    db_data:
